<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vigil — Network operations</title>
    <script>
      try {
        var prefs = JSON.parse(localStorage.getItem("vigil.prefs") || "{}");
        var mode = prefs.displayMode || "auto";
        var scheme =
          mode === "dark" || mode === "light"
            ? mode
            : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = scheme;
        document.documentElement.dataset.scheme = scheme;
        document.documentElement.dataset.palette = prefs.palette || "vigil";
        document.documentElement.dataset.intensity = prefs.intensity || "standard";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
